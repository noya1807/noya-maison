<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ההזמנה שלכם – נויה במתנה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7efe4;color:#4a2f22;font-family:Assistant,Arial,sans-serif;display:flex;justify-content:center;padding:28px 14px 48px}
.w{width:min(560px,100%);display:flex;flex-direction:column;gap:14px}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:500;font-size:28px;margin:0;text-align:center}
.sub{text-align:center;color:#7a5a48;margin:0}
.card{background:#fffaf3;border:1px solid #e2d3c0;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ref{font-weight:700;letter-spacing:.5px}
a.tpl{color:#6e4d3b}
label.up{display:block;text-align:center;border:2px dashed #cfab6c;border-radius:14px;padding:22px 14px;cursor:pointer;font-size:18px;font-weight:600;background:#fff}
label.up input{display:none}
.st{font-size:16px}.ok{color:#1f7a4d;font-weight:700}.bad{color:#b03a2e}.warn{background:#fff4e5;border:1px solid #f0c27a;border-radius:10px;padding:8px 10px;color:#7a4b12}
.note{font-size:14px;color:#7a5a48;margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:flex;gap:12px;align-items:center;padding:7px 0;color:#a8917f;position:relative}
.steps li .d{width:26px;height:26px;border-radius:50%;border:2px solid #d9c6ad;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;right:12px;top:30px;bottom:-8px;width:2px;background:#e4d5c1}
.steps li.done{color:#4a2f22}.steps li.done .d{background:#2f7d4f;border-color:#2f7d4f;color:#fff}
.steps li.now{color:#4a2f22;font-weight:700}.steps li.now .d{border-color:#c9a063;background:#fff4e0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14.5px;color:#6e4d3b}
</style>
</head>
<body>
<div class="w">
  <h1>ההזמנה שלכם</h1>
  <p class="sub">הזמנה <span class="ref" id="ref"></span> · נויה במתנה</p>
  <div class="card" id="track"><div class="note">טוענים את מצב ההזמנה…</div></div>
  <div class="card" id="box">
    <b style="font-size:18px">📎 קובץ הכתובות למשלוח לכל מקבל</b>
    <p class="note">ממלאים שורה לכל מקבל: שם, טלפון נייד, עיר, רחוב ומספר, דירה, כניסה וקומה.
      <a class="tpl" href="https://w4qizitdfylnksov.public.blob.vercel-storage.com/logos/mwgjtu80kbu6aqqanu1kau8f/%D7%A7%D7%95%D7%91%D7%A5-%D7%9B%D7%AA%D7%95%D7%91%D7%95%D7%AA-%D7%A0%D7%95%D7%99%D7%94-%D7%91%D7%9E%D7%AA%D7%A0%D7%94.xlsx" download>⬇️ הורדת קובץ האקסל</a></p>
    <label class="up">📎 בחירת קובץ הכתובות (אקסל או CSV)<input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
    <div class="st" id="st"></div>
  </div>
  <p class="note" style="text-align:center">שאלות? וואטסאפ <a href="https://wa.me/972543219070">054-3219070</a></p>
</div>
<script>
const q=new URLSearchParams(location.search),ref=(q.get("ref")||"").toUpperCase(),k=q.get("k")||"";
const st=document.getElementById("st");document.getElementById("ref").textContent=ref;
const okRef=/^NOYA-[A-Z0-9-]{4,24}$/.test(ref)&&/^[a-z0-9]{8,32}$/.test(k);
if(!okRef){document.getElementById("box").innerHTML='<p class="bad">הקישור לא תקין. אפשר לשלוח את הקובץ בוואטסאפ ל-054-3219070 עם מספר ההזמנה.</p>';}
// count the rows and catch common problems before the file is sent (xlsx is a zip: read it in the browser)
async function zipEntries(buf){const d=new DataView(buf),u=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--)if(d.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0)throw 0;const n=d.getUint16(e+10,true);let p=d.getUint32(e+16,true);const out={};
  for(let j=0;j<n;j++){if(d.getUint32(p,true)!==0x02014b50)break;const m=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),lo=d.getUint32(p+42,true);
    out[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+xl+cl;}
  out.read=async name=>{const f=out[name];if(!f)return "";const s=f.lo+30+d.getUint16(f.lo+26,true)+d.getUint16(f.lo+28,true);const raw=u.slice(s,s+f.cs);
    if(f.m===0)return new TextDecoder().decode(raw);return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();};
  return out;}
// order status (no personal details: only the order number + its private key from the order confirmation)
let ORDER=null;
async function loadTrack(){const el=document.getElementById("track");if(!okRef){el.hidden=true;return;}
  try{const r=await fetch(`/api/office?a=track&ref=${encodeURIComponent(ref)}&k=${encodeURIComponent(k)}`,{cache:"no-store"});const j=await r.json();ORDER=j;
    if(!r.ok||j.stage==="unknown"){el.innerHTML='<div class="note">עוד לא מצאנו את ההזמנה במערכת. אם שלחתם אותה עכשיו, זה יתעדכן תוך כמה שעות. אפשר בינתיים לשלוח כאן את קובץ הכתובות.</div>';return;}
    if(j.stage==="cancelled"){el.innerHTML='<div class="bad"><b>ההזמנה בוטלה.</b> לשאלות: וואטסאפ 054-3219070</div>';document.getElementById("box").hidden=true;return;}
    const order=j.steps.map(s=>s[0]),cur=order.indexOf(j.stage);
    const fmt=d=>{try{return new Date(d).toLocaleDateString("he-IL");}catch(e){return "";}};
    el.innerHTML=`<b style="font-size:18px">📍 מצב ההזמנה</b>
      ${j.org||j.boxes?`<div class="meta">${j.org?`<span>🏢 ${esc(j.org)}</span>`:""}${j.boxes?`<span>🎁 ${j.boxes} מארזים</span>`:""}${j.date?`<span>📅 תאריך מבוקש: ${fmt(j.date)}</span>`:""}</div>`:""}
      <ul class="steps">${j.steps.map(([k2,l],i)=>`<li class="${i<cur||j.stage==="shipped"?"done":i===cur?"now":""}"><span class="d">${i<cur||j.stage==="shipped"?"✓":i+1}</span>${l}${i===cur&&j.stage!=="shipped"?" ← כאן אנחנו":""}</li>`).join("")}</ul>
      ${j.stage==="received"?'<div class="note">נעבור על ההזמנה ונחזור אליכם לאישור סופי. רק אחרי האישור היא נכנסת להכנה.</div>':""}
      ${j.updatedAt?`<div class="note">עודכן: ${fmt(j.updatedAt)}</div>`:""}`;
    const box=document.getElementById("box");
    if(j.needAddr===false)box.hidden=true;
    else if(j.addrFiles){box.insertAdjacentHTML("afterbegin",`<div class="ok">✓ קובץ הכתובות כבר התקבל${j.addrCount?` (${j.addrCount} כתובות${j.boxes?` מתוך ${j.boxes} מארזים`:""})`:""}. אפשר להעלות קובץ מתוקן, הוא יחליף את הקודם.</div>`);}
  }catch(e){el.innerHTML='<div class="note">לא הצלחנו לטעון את מצב ההזמנה כרגע. נסו לרענן בעוד רגע.</div>';}}
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
loadTrack();
async function check(file){
  try{const t=v=>String(v??"").trim(),dig=v=>t(v).replace(/\D/g,"");let rows=[];
    if(/\.csv$/i.test(file.name))rows=(await file.text()).split(/\r?\n/).map(l=>l.split(/[,;\t]/));
    else if(/\.xlsx$/i.test(file.name)){const z=await zipEntries(await file.arrayBuffer()),X=s=>new DOMParser().parseFromString(s,"application/xml");
      const sst=[...X(await z.read("xl/sharedStrings.xml")).getElementsByTagName("si")].map(x=>x.textContent);
      const sh=Object.keys(z).filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort()[0];if(!sh)return {n:0};
      rows=[...X(await z.read(sh)).getElementsByTagName("row")].map(r=>{const a=[];for(const c of r.getElementsByTagName("c")){const col=(c.getAttribute("r")||"").replace(/\d+/g,"").split("").reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1;
        const v=c.getElementsByTagName("v")[0],ty=c.getAttribute("t");a[col<0?a.length:col]=ty==="s"&&v?sst[+v.textContent]:ty==="inlineStr"?c.textContent:v?v.textContent:"";}return Array.from(a,x=>x??"");});}
    else return {n:0};
    const list=rows.slice(1).map(r=>r.map(t)).filter(c=>c.some(Boolean)&&c[0]!=="ישראל ישראלי"&&!/^0?549999999$/.test(dig(c[1]))&&(c[0]||c[1]||c[3]));
    const seen=new Set();let noPhone=0,noAddr=0,dup=0;
    list.forEach(c=>{const p=dig(c[1]);if(!/^(972)?0?5\d{8}$/.test(p))noPhone++;if(!c[2]||!c[3])noAddr++;const key=p||(c[0]+c[3]);if(key){if(seen.has(key))dup++;seen.add(key);}});
    return {n:list.length,noPhone,noAddr,dup};}catch(e){return {n:0};}}
document.getElementById("file").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file||!okRef)return;
  if(!/\.(xlsx|xls|csv)$/i.test(file.name)){st.innerHTML='<span class="bad">רק קובץ אקסל או CSV</span>';return;}
  if(file.size>4*1024*1024){st.innerHTML='<span class="bad">הקובץ גדול מ-4MB. אפשר לשלוח אותו בוואטסאפ.</span>';return;}
  st.textContent="בודקים ושולחים…";
  const r=await check(file);
  try{
    const up=await fetch("/api/logo",{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream","x-file-name":encodeURIComponent(file.name)},body:file});
    const j=await up.json();if(!up.ok||!j.url)throw 0;
    const s=await fetch("/api/office?a=inbox",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref,kind:"addr",k,files:[{name:file.name,url:j.url,count:r.n||0}]})});
    if(!s.ok)throw 0;
    const probs=[r.noPhone?`${r.noPhone} שורות בלי טלפון נייד תקין`:"",r.noAddr?`${r.noAddr} שורות בלי עיר או רחוב`:"",r.dup?`${r.dup} שורות כפולות`:"",ORDER?.boxes&&r.n&&r.n!==ORDER.boxes?`בקובץ ${r.n} כתובות, וההזמנה היא ל-${ORDER.boxes} מארזים`:""].filter(Boolean);
    st.innerHTML=`<div class="ok">✓ הקובץ התקבל${r.n?` · ${r.n} כתובות`:""}. תודה!</div>`+(probs.length?`<div class="warn" style="margin-top:8px">⚠️ שמנו לב: ${probs.join(" · ")}. אפשר לתקן ולהעלות שוב, הקובץ החדש יחליף את הקודם.</div>`:"");
  }catch(err){st.innerHTML='<span class="bad">השליחה נכשלה. נסו שוב, או שלחו את הקובץ בוואטסאפ ל-054-3219070 עם מספר ההזמנה.</span>';}
});
</script>
</body>
</html>
