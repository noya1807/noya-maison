<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>נויה במתנה · ניהול פנימי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f7efe4;--paper:#fffaf3;--sand:#e9dccb;--cocoa:#4a2f22;--soft:#7a5a48;--gold:#b08a4f;--line:#e2d3c0;--ok:#3f7a52;--warn:#a5642a;--bad:#a33b2b;
  --display:"Frank Ruhl Libre",Georgia,serif;--body:"Assistant","Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--cocoa);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.btn{border:1px solid var(--cocoa);background:var(--cocoa);color:var(--paper);border-radius:99px;padding:7px 16px;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cocoa)}.btn.sm{padding:4px 11px;font-size:13px}.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px}.brand small{font:400 12px var(--body);color:var(--soft);display:block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;border-radius:99px;padding:6px 14px;font-weight:600;color:var(--soft)}
nav button.on{background:var(--cocoa);color:var(--paper)}
#saveState{margin-inline-start:auto;font-size:13px;color:var(--soft)}
main{max-width:1280px;margin:0 auto;padding:22px}
h1{font-family:var(--display);font-size:26px;margin:0 0 4px}h2{font-family:var(--display);font-size:20px;margin:22px 0 10px}
.sub{color:var(--soft);margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card .k{font-size:13px;color:var(--soft)}.card .v{font-family:var(--display);font-size:26px;font-weight:700}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:var(--paper)}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{font-size:12.5px;color:var(--soft);font-weight:700;background:#fbf4ea;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:#fbf4ea}
td.num,th.num{text-align:left;direction:ltr;white-space:nowrap}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--sand)}
.st-order{background:#efe6d8}.st-prod{background:#f3e3c4}.st-sea{background:#dbe7f3;color:#24476b}.st-port{background:#f1dcc9;color:#7a3f17}.st-cleared{background:#e3eedd;color:#2e5b3a}.st-wh{background:var(--ok);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--soft);font-weight:600}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--soft);background:#fffdf9}
.drop.over{border-color:var(--gold);background:#fbf2e3}
.muted{color:var(--soft)}.warn{color:var(--warn)}.bad{color:var(--bad)}.okc{color:var(--ok)}
.sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;direction:ltr;display:inline-block}
.modal{position:fixed;inset:0;background:rgba(40,25,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:20;overflow:auto}
.modal>div{background:var(--paper);border-radius:16px;padding:20px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}
#login .box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px;width:min(380px,92vw);text-align:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--cocoa);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;display:none;max-width:90vw}
.back{background:none;border:none;color:var(--soft);font-weight:600;padding:0;margin-bottom:10px}
td input,td select{padding:4px 6px}
[hidden]{display:none!important}
@media print{header,#toast,.btn{display:none!important}body{background:#fff}.panel,.card,table{break-inside:avoid}}
@media (max-width:700px){main{padding:14px}header{padding:10px 14px}}

.supgrp{border:1px solid var(--line,#e7dccb);border-radius:14px;margin-bottom:14px;overflow:hidden;background:#fffdf9}
.sup-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;padding:10px 14px;background:#f4ebdd;border-bottom:1px solid var(--line,#e7dccb)}
.sup-sum{font-size:13px;color:#6b5444}
.itm{padding:10px 14px;border-bottom:1px solid #f0e7da}.itm:last-child{border-bottom:0}
.itm-top{display:flex;gap:8px;align-items:center}.itm-name{flex:1;font-weight:600}
.itm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:8px}
.itm-grid label{font-size:12px;color:#7a6656;display:flex;flex-direction:column;gap:3px}
.itm-out{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#7a6656;justify-content:flex-end}.itm-out b{font-size:14px;color:#3b2a20}.itm-out b.gold{color:#8a6a35}
.itm-more{margin-top:6px;font-size:12px;color:#7a6656}.itm-more input{margin-top:4px;max-width:340px}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <div class="brand" style="font-size:26px">נויה במתנה<small>ניהול פנימי · גישה למנהל בלבד</small></div>
    <form id="loginForm" style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
      <input id="pw" type="password" placeholder="סיסמת מנהל" autocomplete="current-password" required>
      <button class="btn" type="submit">כניסה</button>
      <div id="loginErr" class="bad" hidden></div>
    </form>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="brand">נויה במתנה<small>ניהול פנימי</small></div>
  <nav id="nav">
    <button data-v="dash" class="on">לוח בקרה</button>
    <button data-v="ships">מכולות ויבוא</button>
    <button data-v="cash">תזרים</button>
    <button data-v="orders">הזמנות</button>
    <button data-v="prods">מוצרים</button>
    <button data-v="stock">מלאי</button>
    <button data-v="sups">ספקים</button>
    <button data-v="settings">הגדרות</button>
  </nav>
  <span id="saveState"></span>
</header>
<main id="view"></main>
</div>
<div id="toast"></div>
<div id="modal" class="modal" hidden><div id="modalBox"></div></div>

<script>
"use strict";
const API="api/office";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/[,₪$€\s]/g,""));return isFinite(n)?n:0;};
const money=(v,cur="₪")=>v||v===0?(cur==="₪"?"₪":"")+(+v).toLocaleString("he-IL",{maximumFractionDigits:2})+(cur!=="₪"&&cur?" "+cur:""):"";
const fmtDate=d=>d?new Date(d+"T00:00").toLocaleDateString("he-IL",{day:"numeric",month:"short",year:"numeric"}):"";
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function toast(t,ms=2600){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",ms);}

const STATUSES=[["order","הוזמן"],["prod","בייצור"],["sea","בים"],["port","בנמל"],["cleared","שוחרר"],["wh","במחסן"]];
const stName=s=>(STATUSES.find(x=>x[0]===s)||STATUSES[0])[1];
const DOC_KINDS=["חשבונית פרופורמה","Packing List","שטר מטען (B/L)","רשימון יבוא","חשבונית הובלה","חשבונית עמיל מכס","תעודת מקור","אחר"];
// each cost: [key, label, default split]. "vol" = by the CBM each line takes in the container, "val" = by the value of each line
const COSTS=[["originFreight","הובלה בארץ המקור עד הנמל (₪)","vol"],["freight","הובלה ימית (₪)","vol"],["port","נמל ואחסנה (₪)","vol"],["clearance","עמיל מכס ושחרור (₪)","vol"],["local","הובלה למחסן (₪)","vol"],["customs","מכס ומיסים (₪)","val"],["fees","עמלות – Alibaba, בנק וכו׳ (₪)","val"],["other","אחר (₪)","val"]];
const costMethod=(s,k)=>(s.costMethod&&s.costMethod[k])||COSTS.find(c=>c[0]===k)[2];
const DEFAULT_CATS=[["DB","דבש"],["WN","יין ואלכוהול"],["CH","שוקולד וממתקים"],["DF","פירות יבשים ואגוזים"],["CF","קפה ותה"],["GR","גורמה, ממרחים ורטבים"],["OL","שמן זית"],["KT","כלי מטבח והגשה"],["HM","עיצוב הבית"],["CN","נרות וריחות"],["SP","טיפוח וספא"],["TX","טקסטיל"],["JD","יודאיקה"],["TC","גאדג'טים ואלקטרוניקה"],["BG","תיקים ואביזרים"],["BX","אריזות – קופסאות, סלסלות, מגשים"],["AC","אביזרי אריזה – סרטים, כרטיסים, מילוי"],["EQ","ציוד לעסק (לא למכירה)"],["OT","אחר"]].map(([code,name])=>({code,name}));
const DEFAULT_SETTINGS={markup:3,costFiller:0,costLabor:0,costCard:0,costEngrave:0,shipOne:0,shipIndiv:0,shipVip:0,minMargin:30,vatRate:18};
const emptyDb=()=>({v:1,products:[],shipments:[],suppliers:[],orders:[],stockAdj:[],settings:{...DEFAULT_SETTINGS},categories:DEFAULT_CATS.map(c=>({...c})),seq:{}});

let db=null,rev="",dirty=false,saving=false,view="dash",sel=null,selOrder=null;

async function api(a,opt={}){
  const r=await fetch(API+"?a="+a+(opt.qs||""),{method:opt.method||"GET",credentials:"same-origin",headers:opt.headers||(opt.body?{"Content-Type":"application/json"}:{}),body:opt.raw||(opt.body?JSON.stringify(opt.body):undefined)});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&a!=="login"){showLogin();throw new Error("צריך להתחבר מחדש");}
  if(!r.ok)throw Object.assign(new Error(j.error||("שגיאה "+r.status)),{status:r.status});
  return j;
}
function showLogin(){$("#app").hidden=true;$("#login").hidden=false;$("#pw").focus();}
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#loginErr").hidden=true;
  try{await api("login",{method:"POST",body:{password:$("#pw").value}});$("#pw").value="";await boot();}
  catch(err){$("#loginErr").textContent=err.message;$("#loginErr").hidden=false;}};

async function boot(){
  const j=await api("data");
  db=j.db||emptyDb();rev=j.rev||"";
  db.products??=[];db.shipments??=[];db.suppliers??=[];db.categories??=DEFAULT_CATS.map(c=>({...c}));db.seq??={};db.orders??=[];db.stockAdj??=[];db.settings={...DEFAULT_SETTINGS,...(db.settings||{})};
  $("#login").hidden=true;$("#app").hidden=false;setSave(j.db?"שמור":"מערכת חדשה – הנתונים יישמרו אוטומטית");render();pullInbox();
}
(async()=>{try{await api("me");await boot();}catch(e){showLogin();}})();

// ---------- saving (automatic, debounced) ----------
function setSave(t,cls){const e=$("#saveState");e.textContent=t;e.className=cls||"";}
function touch(){_costs=null;dirty=true;setSave("שומר…");clearTimeout(touch.t);touch.t=setTimeout(save,4000);}
async function save(){
  if(saving){touch();return;}if(!dirty)return;saving=true;dirty=false;
  try{const j=await api("data",{method:"PUT",body:{db,baseRev:rev}});rev=j.rev;setSave("✓ נשמר "+new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}),"okc");}
  catch(e){dirty=true;setSave("⚠ לא נשמר: "+e.message,"bad");if(e.status===409)toast("הנתונים עודכנו בחלון אחר. רעננו את הדף.",6000);}
  finally{saving=false;}
}
window.addEventListener("beforeunload",e=>{if(dirty||saving){e.preventDefault();e.returnValue="";}});

// ---------- helpers on the data ----------
const catByName=n=>db.categories.find(c=>c.name.trim()===String(n||"").trim());
const catName=code=>(db.categories.find(c=>c.code===code)||{}).name||code||"";
const prodBySku=s=>db.products.find(p=>p.sku===s);
function nextSku(code){
  const max=db.products.filter(p=>p.sku?.startsWith(code+"-")).reduce((m,p)=>Math.max(m,parseInt(p.sku.split("-")[1])||0),0);
  db.seq[code]=Math.max(db.seq[code]||0,max)+1;return code+"-"+String(db.seq[code]).padStart(4,"0");
}
function newCatCode(){const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";for(const a of "XYZQ")for(const b of L){const c=a+b;if(!db.categories.some(k=>k.code===c))return c;}return "Z"+db.categories.length;}
const cbm=p=>p.cartonL&&p.cartonW&&p.cartonH?p.cartonL*p.cartonW*p.cartonH/1e6:0;
// cost of a product = weighted average landed cost over every container line linked to its SKU; otherwise the cost typed in its card
function skuCosts(){
  const acc={};
  db.shipments.forEach(s=>{const c=shipCalc(s);if(!c.ok)return;c.lines.forEach(l=>{if(!l.sku||!l.landed)return;const o=acc[l.sku]??={q:0,v:0};o.q+=num(l.qty);o.v+=l.landed*num(l.qty);});});
  return Object.fromEntries(Object.entries(acc).map(([k,o])=>[k,o.q?o.v/o.q:0]));
}
let _costs=null;const costOf=sku=>{_costs??=skuCosts();const p=prodBySku(sku);return _costs[sku]||num(p?.landedCost)||0;};
const margin=p=>{const c=costOf(p.sku);return p.salePrice>0&&c>0?(p.salePrice-c)/p.salePrice:null;};
const CURS=["USD","EUR","CNY","TRY","ILS"];
function normShip(s){
  s.costs??={};s.items??=[];s.docs??=[];s.fxRates??={};
  if(s.fx&&!s.fxRates[s.currency]){s.fxRates[s.currency]=s.fx;}delete s.fx;   // older single-rate containers
  return s;
}
const lineCur=(s,i)=>i.currency||s.currency||"USD";
const rateOf=(s,cur)=>cur==="ILS"?1:num(s.fxRates?.[cur]);
const shipSuppliers=s=>[...new Set([s.supplier,...(s.items||[]).map(i=>i.supplier)].map(x=>String(x||"").trim()).filter(Boolean))];
const shipCurs=s=>[...new Set([s.currency||"USD",...(s.items||[]).map(i=>lineCur(s,i))])];
function shipCalc(s){
  normShip(s);
  const missing=shipCurs(s).filter(c=>(s.items||[]).some(i=>lineCur(s,i)===c&&num(i.qty)*num(i.unitPrice))&&!rateOf(s,c));
  const lines0=s.items.map(i=>{const cur=lineCur(s,i),r=rateOf(s,cur),v=num(i.qty)*num(i.unitPrice);return {...i,cur,orig:v,valueIls:v*r};});
  const goodsIls=lines0.reduce((t,l)=>t+l.valueIls,0);
  const byCur={};lines0.forEach(l=>{byCur[l.cur]=(byCur[l.cur]||0)+l.orig;});
  const extra=COSTS.reduce((t,[k])=>t+num(s.costs?.[k]),0);
  const volCosts=COSTS.reduce((t,[k])=>t+(costMethod(s,k)==="vol"?num(s.costs?.[k]):0),0),valCosts=extra-volCosts;
  const totalCbm=lines0.reduce((t,l)=>t+num(l.cbm),0);
  const missingCbm=lines0.filter(l=>l.valueIls&&!(num(l.cbm)>0)).length;
  const byVol=volCosts>0&&totalCbm>0&&!missingCbm;            // volume split only when every line has its CBM
  const total=goodsIls+extra;
  const lines=lines0.map(l=>{const sv=goodsIls>0?l.valueIls/goodsIls:0,sc=byVol?num(l.cbm)/totalCbm:sv;
    const share=valCosts*sv+volCosts*sc;return {...l,share,landed:num(l.qty)>0&&l.valueIls?(l.valueIls+share)/num(l.qty):0};});
  const bySup={};lines.forEach(l=>{const k=String(l.supplier||s.supplier||"ללא ספק").trim()||"ללא ספק";const o=bySup[k]??={goodsIls:0,landed:0,lines:0};o.goodsIls+=l.valueIls;o.landed+=l.landed*num(l.qty);o.lines++;});
  return {ok:!missing.length,missing,goodsIls,byCur,extra,volCosts,valCosts,totalCbm,missingCbm,byVol,total,lines,bySup,factor:goodsIls>0?total/goodsIls:0};
}

// ---------- payments: what was paid and what is still due (default due date = container arrival) ----------
function shipPayments(s){
  const c=shipCalc(s);s.paid??={};s.due??={};
  const rows=[];
  const goodsBy=Object.entries(c.byCur).filter(([,v])=>v).map(([k,v])=>money(Math.round(v*100)/100,k==="ILS"?"₪":k)).join(" + ");
  if(c.goodsIls)rows.push({k:"goods",label:"סחורה לספקים"+(goodsBy?` (${goodsBy})`:""),amount:c.goodsIls});
  COSTS.forEach(([k,l])=>{const v=num(s.costs?.[k]);if(v)rows.push({k,label:l.replace(" (₪)",""),amount:v});});
  const vr=num(s.vatRate??18);if(c.total&&vr)rows.push({k:"vat",label:`מע״מ ${vr}% (חוזר בקיזוז)`,amount:c.total*vr/100});
  rows.forEach(r=>{r.paid=!!s.paid[r.k];r.due=s.due[r.k]||s.eta||"";});
  const open=rows.filter(r=>!r.paid);
  return {rows,open,left:open.reduce((t,r)=>t+r.amount,0),ok:c.ok};
}
const daysTo=d=>d?Math.round((new Date(d+"T00:00")-new Date(new Date().toDateString()))/864e5):null;

// ---------- navigation ----------
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;sel=null;selOrder=null;render();};
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  ({dash:renderDash,cash:renderCash,ships:sel?renderShip:renderShips,prods:renderProds,orders:selOrder?renderOrder:renderOrders,stock:renderStock,sups:renderSups,settings:renderSettings})[view]();
  window.scrollTo(0,0);
}

// ---------- dashboard ----------
function renderDash(){
  const open=db.shipments.filter(s=>s.status!=="wh");
  const sea=open.reduce((t,s)=>t+shipCalc(s).total,0);
  const next=open.filter(s=>s.eta).sort((a,b)=>a.eta.localeCompare(b.eta))[0];
  const dues=db.shipments.flatMap(s=>shipPayments(s).open.map(r=>({...r,s}))).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const left=dues.reduce((t,r)=>t+r.amount,0);
  const mon=new Date().toISOString().slice(0,7);
  const appr=db.orders.filter(o=>o.status==="approved"&&(o.approvedAt||"").slice(0,7)===mon).map(orderCalc);
  const salesNet=appr.reduce((t,c)=>t+c.net,0),costM=appr.reduce((t,c)=>t+c.cost,0),profM=salesNet-costM;
  const pend=db.orders.filter(o=>o.status==="pending");const pendSum=pend.reduce((t,o)=>t+num(o.gross),0);
  const S=stockAll();const low=db.products.filter(p=>num(p.minStock)>0&&(S[p.sku]?.available||0)<num(p.minStock));
  $("#view").innerHTML=`<h1>לוח בקרה</h1><p class="sub">תמונת מצב של היבוא והמוצרים. הנתונים כאן פרטיים ומוצפנים, והלקוחות לא רואים אותם.</p>
  <div class="cards">
    <div class="card"><div class="k">מכולות פתוחות</div><div class="v">${open.length}</div></div>
    <div class="card"><div class="k">עלות משוערת של מה שבדרך</div><div class="v">${money(Math.round(sea))||"₪0"}</div></div>

  ${missing.length?`<p class="warn">⚠ חסר שער המרה ב: ${esc(missing.join(", "))}. הסכומים שלהן לא מדויקים.</p>`:""}
  <div class="cards">
    <div class="card"><div class="k">סה״כ להיערך${cashVat?" (כולל מע״מ)":" (בלי מע״מ)"}</div><div class="v">${money(Math.round(total))||"₪0"}</div></div>
    ${cashVat?`<div class="card"><div class="k">מתוכו מע״מ (חוזר בקיזוז)</div><div class="v">${money(Math.round(vatT))||"₪0"}</div></div>
    <div class="card"><div class="k">בלי מע״מ</div><div class="v">${money(Math.round(total-vatT))||"₪0"}</div></div>`:""}
    <div class="card"><div class="k">התשלום הקרוב</div><div class="v" style="font-size:20px">${dated[0]?esc(fmtDate(dated[0].due)):"—"}</div><div class="k">${dated[0]?`בעוד ${daysTo(dated[0].due)} ימים`:""}</div></div>
  </div>
  ${Object.keys(byMonth).length?`<h2>לפי חודש</h2><div class="tablewrap" style="margin-bottom:18px"><table><thead><tr><th>חודש</th><th class="num">תשלומים בלי מע״מ</th>${cashVat?'<th class="num">מע״מ</th>':""}<th class="num">סה״כ לחודש</th><th class="num">מצטבר</th></tr></thead><tbody>
    ${(()=>{let acc=0;return Object.entries(byMonth).map(([m,o])=>{acc+=o.net+o.vat;return `<tr><td><b>${esc(mName(m))}</b></td><td class="num">${money(Math.round(o.net))}</td>${cashVat?`<td class="num">${money(Math.round(o.vat))||"₪0"}</td>`:""}<td class="num"><b>${money(Math.round(o.net+o.vat))}</b></td><td class="num">${money(Math.round(acc))}</td></tr>`;}).join("");})()}
  </tbody></table></div>`:""}
  <h2>לפי תאריך</h2>
  ${Object.entries(byDate).map(([d,rows])=>{const sub=rows.reduce((t,r)=>t+r.amount,0);run+=sub;const dd=daysTo(d);const ships=[...new Set(rows.map(r=>r.s.name))];
    return `<div class="panel"><div class="row" style="justify-content:space-between"><div><b style="font-size:17px">${esc(fmtDate(d))}</b> <span class="${dd<0?"bad":dd<=14?"warn":"muted"}">${dd<0?`באיחור של ${-dd} ימים`:dd===0?"היום":`בעוד ${dd} ימים`}</span>
      <div class="muted" style="font-size:13px">${esc(ships.join(" · "))}</div></div><div style="text-align:left"><div class="v" style="font-family:var(--display);font-size:22px;font-weight:700">${money(Math.round(sub))}</div><div class="muted" style="font-size:12.5px">מצטבר: ${money(Math.round(run))}</div></div></div>
      <table style="margin-top:8px"><tbody>${rows.map(r=>`<tr class="click" data-id="${esc(r.s.id)}"><td>${esc(r.s.name)}</td><td>${esc(r.label)}</td><td class="num">${money(Math.round(r.amount))}</td></tr>`).join("")}</tbody></table></div>`;}).join("")||`<div class="panel muted">אין תשלומים פתוחים עם תאריך.</div>`}
  ${noDate.length?`<h2>בלי תאריך</h2><div class="panel"><p class="warn" style="margin-top:0">למכולות האלה אין מועד הגעה ולכן אין תאריך לתשלום. כדאי להשלים.</p><table><tbody>${noDate.map(r=>`<tr class="click" data-id="${esc(r.s.id)}"><td>${esc(r.s.name)}</td><td>${esc(r.label)}</td><td class="num">${money(Math.round(r.amount))}</td></tr>`).join("")}</tbody></table></div>`:""}`;
  $("#cVat").onchange=e=>{cashVat=e.target.checked;renderCash();};bindShipRows();

  ${list.map(s=>{const c=shipCalc(s);return `<tr class="click" data-id="${esc(s.id)}"><td><b>${esc(s.name)}</b></td><td>${esc(shipSuppliers(s).join(", "))}</td><td class="sku">${esc(s.containerNo)}</td>
  <td><span class="pill st-${esc(s.status)}">${stName(s.status)}</span></td><td>${esc(fmtDate(s.eta))}</td><td class="num">${c.ok?(c.total?money(Math.round(c.total)):""):`<span class="warn">חסר שער</span>`}</td><td>${(s.docs||[]).length||""}</td></tr>`}).join("")}
  </tbody></table></div>`;
}

function newShip(){const n=db.shipments.length+1;const s={id:uid(),name:"מכולה "+n,supplier:"",containerNo:"",type:"40HQ",status:"order",etd:"",eta:"",currency:"USD",fxRates:{},costs:{},items:[],docs:[],notes:"",createdAt:new Date().toISOString()};

  <div class="panel"><div class="grid">${COSTS.map(([k,l])=>`<label class="f">${l}<input data-c="${k}" inputmode="decimal" dir="ltr" value="${esc(s.costs[k])}">
      <select data-cm="${k}" style="padding:3px 6px;font-size:12.5px;font-weight:400"><option value="vol" ${costMethod(s,k)==="vol"?"selected":""}>מתחלק לפי נפח (CBM)</option><option value="val" ${costMethod(s,k)==="val"?"selected":""}>מתחלק לפי שווי</option></select></label>`).join("")}</div>

  <h2>הערות</h2><div class="panel"><textarea data-k="notes" rows="3">${esc(s.notes)}</textarea></div>`;

  $("#back").onclick=()=>{sel=null;render();};
  $("#sDel").onclick=()=>{if(!confirm(`למחוק את "${s.name}"? המסמכים שלה יימחקו גם הם.`))return;

    db.shipments=db.shipments.filter(x=>x!==s);touch();sel=null;render();};
  document.querySelectorAll("[data-k]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{s[el.dataset.k]=el.value;if(el.dataset.k==="name")$("#sTitle").textContent=el.value;touch();if(["currency","supplier"].includes(el.dataset.k)){drawFx();drawItems();}if(el.dataset.k==="eta")drawPay();}));

  $("#applyLanded").onclick=()=>{const c=shipCalc(s);if(!c.ok){toast("חסר שער המרה ל-"+c.missing.join(", "));return;}let n=0;
    c.lines.forEach(l=>{const p=prodBySku(l.sku);if(p&&l.landed){p.landedCost=Math.round(l.landed*100)/100;p.landedFrom=s.name;n++;}});
    touch();toast(n?`עודכנה עלות נחיתה ב-${n} מוצרים`:"אין שורות שמקושרות למק״ט של מוצר");};
  drawDocs(s);drawFx();drawItems();

    s.items.forEach((it,i)=>{const sup=(it.supplier||s.supplier||"").trim()||"ספק לא מוגדר";if(!groups.has(sup))groups.set(sup,[]);groups.get(sup).push(i);});

        <label>CBM<input data-f="cbm" inputmode="decimal" dir="ltr" value="${esc(it.cbm)}" title="נפח השורה במכולה"></label>
        <div class="itm-out"><span>שווי</span><b>${l.valueIls?money(Math.round(l.valueIls)):(l.orig&&!rateOf(s,l.cur)?'<span class="warn">חסר שער</span>':"—")}</b></div>
        <div class="itm-out"><span>עלות נחיתה ליחידה</span><b class="gold">${l.landed&&c.ok?money(Math.round(l.landed*100)/100):"—"}</b></div>
      </div>
      <details class="itm-more"><summary>ספק השורה</summary><input data-f="supplier" list="supList" placeholder="${esc(s.supplier||"ספק")}" value="${esc(it.supplier)}"></details>
    </div>`;};

async function extractDoc(s,d,btn){
  const t0=btn.textContent;btn.disabled=true;btn.textContent="קורא את המסמך… (עד 2 דקות)";
  try{
    let body={url:d.url,type:d.type};
    if(/\.(xlsx?|csv)$/i.test(d.name)||/sheet|excel|csv/i.test(d.type)){
      await loadXlsx();const buf=await (await fetch(`${API}?a=file&url=${encodeURIComponent(d.url)}&name=x`,{credentials:"same-origin"})).arrayBuffer();
      const wb=XLSX.read(buf);body={name:d.name,text:wb.SheetNames.map(n=>`### ${n}\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n")};
    }
    const {result}=await api("extract",{method:"POST",body});
    showExtract(s,d,result);
  }catch(e){toast("השליפה נכשלה: "+e.message,7000);}

function guessKind(n){n=n.toLowerCase();if(/proforma|pi[\s_-]|פרופורמה|invoice/.test(n))return DOC_KINDS[0];if(/packing|pl[\s_-]/.test(n))return DOC_KINDS[1];if(/b\/?l|bill|lading|שטר/.test(n))return DOC_KINDS[2];if(/רשימון|customs/.test(n))return DOC_KINDS[3];return "אחר";}
async function shrinkImage(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<=4e6)return f;
  const img=await createImageBitmap(f);const sc=Math.min(1,2600/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return new File([b],f.name.replace(/\.\w+$/,".jpg"),{type:"image/jpeg"});
}
async function uploadFiles(s,files){
  for(const f0 of files){
    const f=await shrinkImage(f0);
    if(f.size>4.3*1024*1024){toast(`"${f.name}" גדול מ-4.3MB. אפשר לשלוח אותו לClaude בצ'אט.`,5000);continue;}
    toast(`מעלה את ${f.name}…`,60000);
    try{const j=await api("upload",{method:"POST",raw:f,headers:{"Content-Type":f.type||"application/octet-stream","x-file-name":encodeURIComponent(f.name),"x-folder":s.id}});
      s.docs.push({...j.doc,kind:guessKind(f.name)});touch();drawDocs(s);toast(`✓ ${f.name} הועלה`);}
    catch(e){toast(`העלאת ${f.name} נכשלה: ${e.message}`,5000);}
  }
  $("#files").value="";
}

async function importXls(file){

    const hi=rows.findIndex(r=>r.some(c=>norm(c).startsWith("שםמוצר")));
    if(hi<0)throw new Error("לא נמצאה שורת כותרות (\"שם מוצר\"). השתמשו בקובץ ההעלאה של נויה.");
    const H=rows[hi].map(norm);
    const col=label=>H.findIndex(h=>h.startsWith(norm(label).replace(/\(.*$/,"")));

      const get=k=>map[k]>=0?String(r[map[k]]??"").trim():"";

      const o={};PFIELDS.forEach(([k])=>{if(k==="cat")return;const v=get(k);if(v!=="")o[k]=NUMF.has(k)?num(v):v;});
      o.name=name;

      if(!c){c={code:newCatCode(),name:cn};db.categories.push(c);newCats.push(c);}
      o.cat=c.code;

      if(ex){Object.assign(ex,o);updated++;}else fresh.push(o);

function stockAll(){
  const m={};const o=k=>m[k]??={received:0,consumed:0,reserved:0,adj:0,transit:0,eta:""};
  db.shipments.forEach(s=>(s.items||[]).forEach(it=>{if(!it.sku)return;const x=o(it.sku);if(s.status==="wh")x.received+=num(it.qty);else{x.transit+=num(it.qty);if(s.eta&&(!x.eta||s.eta<x.eta))x.eta=s.eta;}}));

  ${o.status==="approved"?`<p>שלב: <span class="pill ${fulLabel(o)[1]}">${fulLabel(o)[0]}</span>${fulOf(o)!=="engrave"&&o.engrave?"":""} ${fulOf(o)!=="packing"&&fulOf(o)!=="engrave"?`<button class="btn sm ghost" id="oFulBack">← שלב אחורה</button>`:""}${shortOf(o)&&fulOf(o)!=="shipped"?' <span class="pill st-port">⚠ חסר מלאי לחלק מהמוצרים</span>':""}</p>`:""}
  <h2>אספקה</h2><div class="panel">
    <p style="margin:0 0 6px"><b>${esc(DLV_SHORT[o.dlvMode]||o.dlvName||"")}</b>${o.date?` · תאריך רצוי: ${esc(new Date(o.date).toLocaleDateString("he-IL"))}`:""}</p>
    ${o.dlvMode==="ship"?`<p style="margin:0">כתובת: ${esc([o.dlv?.street,o.dlv?.city].filter(Boolean).join(", ")||"לא צוינה")}${o.dlv?.addrNote?` · ${esc(o.dlv.addrNote)}`:""}<br>מקבל: ${esc(o.dlv?.rcvName||o.customer?.name||"")} ${o.dlv?.rcvPhone||o.customer?.phone?`<span dir="ltr">${esc(o.dlv?.rcvPhone||o.customer?.phone)}</span>`:""}</p>`:""}
    ${["indiv","vip"].includes(o.dlvMode)?((o.addrFiles||[]).length?`<p style="margin:0">${o.addrFiles.map(f=>`📎 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>${f.count?` (${f.count} כתובות${num(f.count)!==num(o.boxes)?` ⚠ הוזמנו ${o.boxes}`:""})`:""}${f.late?' <span class="muted">· נשלח אחר כך</span>':""}`).join("<br>")}</p>`
      :`<p class="warn" style="margin:0">עוד לא הגיע קובץ כתובות.${lateLink(o)?` קישור אישי ללקוח: <a href="${esc(lateLink(o))}" target="_blank" rel="noopener" dir="ltr">${esc(lateLink(o))}</a> (נכלל אוטומטית ב"עדכן לקוח")`:""}</p>`):""}
    ${o.dlvMode==="pickup"?`<p style="margin:0">איסוף מהענבר 1, ברקן</p>`:""}
    ${(o.engraveFiles||[]).length?`<p style="margin:6px 0 0">קובץ לוגו: ${o.engraveFiles.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join(" · ")}</p>`:""}
    ${o.cardImg?`<p style="margin:6px 0 0"><a href="${esc(o.cardImg)}" target="_blank" rel="noopener">📸 כרטיס ההזמנה (תמונה עם כל הפרטים, להדפסה למחסן)</a></p>`:""}
  </div>
  <h2>לקוח</h2><div class="panel"><div class="grid">
    ${[["name","שם"],["org","ארגון"],["phone","טלפון"],["email","מייל"]].map(([k,l])=>`<label class="f">${l}<input data-cu="${k}" value="${esc(o.customer?.[k]||"")}" ${dis} ${["phone","email"].includes(k)?'dir="ltr"':""}></label>`).join("")}
    <label class="f">כמות מארזים<input data-o="boxes" inputmode="numeric" dir="ltr" value="${esc(o.boxes)}" ${dis}></label>
    <label class="f">סה״כ לתשלום כולל מע״מ (₪)<input data-o="gross" inputmode="decimal" dir="ltr" value="${esc(o.gross)}" ${dis}></label>
    <label class="f">אספקה<select data-o="dlvMode" ${dis}>${[["ship","משלוח לכתובת אחת"],["indiv","משלוח פרטני לכל מקבל"],["vip","משלוח VIP לכל מקבל"],["pickup","איסוף עצמי"]].map(([k,l])=>`<option value="${k}" ${o.dlvMode===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="f">תוספות<span class="row" style="font-weight:400;color:var(--cocoa)"><label class="row" style="gap:4px"><input type="checkbox" data-ob="card" ${o.card?"checked":""} ${dis} style="width:auto"> כרטיס ברכה</label><label class="row" style="gap:4px"><input type="checkbox" data-ob="engrave" ${o.engrave?"checked":""} ${dis} style="width:auto"> חריטה</label></span></label>
  </div></div>
  <h2>מוצרים בהזמנה (כמות כוללת לכל המארזים)</h2>
  <div class="panel"><div class="tablewrap" style="max-height:none"><table><thead><tr><th>פריט</th><th style="width:220px">מוצר במערכת (מק״ט)</th><th class="num">כמות</th><th class="num">זמין</th><th class="num">עלות ליחידה</th><th class="num">עלות</th><th></th></tr></thead><tbody>
  ${c.lines.map((l,i)=>{const av=l.sku?(S[l.sku]?.available??0)+(o.status==="pending"?num(l.qty):0):null;return `<tr data-li="${i}"><td>${esc(l.name)}${l.bid?` <span class="muted" style="font-size:12px">(בונה ${esc(l.bid)})</span>`:""}</td>
    <td><input data-l="sku" list="ordProds" value="${esc(l.sku)}" placeholder="בחרו מוצר" dir="ltr" ${dis}></td>
    <td class="num"><input data-l="qty" inputmode="numeric" dir="ltr" value="${esc(l.qty)}" style="width:80px" ${dis}></td>
    <td class="num ${av!==null&&av<num(l.qty)?"bad":""}">${av===null?"":av.toLocaleString("he-IL")}</td>
    <td class="num"><input data-l="unitCost" inputmode="decimal" dir="ltr" value="${esc(l.unitCost??"")}" placeholder="${l.sku&&costOf(l.sku)?(Math.round(costOf(l.sku)*100)/100):"עלות"}" style="width:90px" ${dis}></td>
    <td class="num">${l.cost?money(Math.round(l.cost)):'<span class="warn">חסר</span>'}</td><td>${locked?"":`<button class="btn sm ghost" data-ldel="${i}">✕</button>`}</td></tr>`;}).join("")||`<tr><td colspan="7" class="muted">אין שורות.</td></tr>`}
  </tbody></table></div><datalist id="ordProds">${prodOpts}</datalist>
  ${locked?"":`<button class="btn sm ghost" id="oAddLine" style="margin-top:10px">+ שורה</button>`}
  <p class="muted" style="font-size:12.5px;margin-bottom:0">עלות ריקה = העלות הממוצעת של המוצר מהמכולות. כשבוחרים מוצר לשורה שהגיעה מהבונה, המערכת זוכרת את הקישור להזמנות הבאות.</p></div>
  <h2>עלויות קבועות בהזמנה</h2><div class="panel">${[["filler","מילוי וסרט"],["labor","עבודת אריזה"],["card","כרטיסי ברכה"],["engrave","חריטה"],["ship","משלוח (עלות בפועל)"]].map(([k,l])=>`<span style="display:inline-block;margin:0 0 6px 18px">${l}: <b>${money(Math.round(c.fixed[k]))||"₪0"}</b></span>`).join("")}
    <p class="muted" style="font-size:12.5px;margin:4px 0 0">הסכומים לכל מארז נקבעים פעם אחת ב"הגדרות".</p></div>
  <h2>הערות</h2><div class="panel"><textarea data-o="notes" rows="3" ${dis}>${esc(o.notes)}</textarea>${o.text?`<details style="margin-top:8px"><summary class="muted">ההודעה המקורית מהבונה</summary><pre style="white-space:pre-wrap;font:inherit;font-size:13px">${esc(o.text)}</pre></details>`:""}</div>`;
  $("#oBack").onclick=()=>{selOrder=null;render();};
  const re=()=>{touch();renderOrder();};
  document.querySelectorAll("[data-cu]").forEach(el=>el.onchange=()=>{(o.customer??={})[el.dataset.cu]=el.value.trim();touch();});
  document.querySelectorAll("[data-o]").forEach(el=>el.onchange=()=>{const k=el.dataset.o;o[k]=["boxes","gross"].includes(k)?num(el.value):el.value;
    if(k==="boxes")(o.lines||[]).forEach(l=>{if(l.perBox)l.qty=l.perBox*num(el.value);});re();});
  document.querySelectorAll("[data-ob]").forEach(el=>el.onchange=()=>{o[el.dataset.ob]=el.checked;re();});
  document.querySelectorAll("[data-l]").forEach(el=>el.onchange=()=>{const l=o.lines[+el.closest("tr").dataset.li],k=el.dataset.l;
    if(k==="sku"){const v=el.value.trim();const p=prodBySku(v)||db.products.find(x=>x.name===v);l.sku=p?p.sku:"";if(p&&l.bid){p.builderIds=[...new Set([...(p.builderIds||[]),l.bid])];}}
    else if(k==="qty"){l.qty=num(el.value);l.perBox=0;}else l.unitCost=el.value.trim()===""?undefined:num(el.value);re();});
  document.querySelectorAll("[data-ldel]").forEach(b=>b.onclick=()=>{o.lines.splice(+b.dataset.ldel,1);re();});
  if($("#oAddLine"))$("#oAddLine").onclick=()=>{(o.lines??=[]).push({sku:"",name:"",qty:num(o.boxes)||1,perBox:1});re();};
  const setSt=(st,msg)=>{o.status=st;if(st!=="approved")o.ful="";if(st==="approved"){o.frozen=JSON.parse(JSON.stringify(orderCalc({...o,status:"pending"})));o.approvedAt=new Date().toISOString();}else{delete o.frozen;delete o.approvedAt;}touch();renderOrder();toast(msg);};
  if($("#oApprove"))$("#oApprove").onclick=()=>{const short=c.lines.filter(l=>l.sku&&(S[l.sku]?.available??0)<0);
    if(c.missing&&!confirm(`ל-${c.missing} שורות אין עלות, ולכן הרווח שיוקפא יהיה גבוה מהאמת. לאשר בכל זאת?`))return;
    if(!confirm("לאשר סופית? העלות תוקפא, ההזמנה תיספר ברווח והמוצרים יירדו מהמלאי."))return;setSt("approved","ההזמנה אושרה ✓");};
  if($("#oCancel"))$("#oCancel").onclick=()=>{if(confirm("לסמן את ההזמנה כבוטלה?"))setSt("cancelled","ההזמנה סומנה כבוטלה");};
  if($("#oUnapprove"))$("#oUnapprove").onclick=()=>{if(confirm("לבטל את האישור? ההזמנה תחזור ל'ממתינה', המוצרים יחזרו למלאי והעלות תחושב מחדש."))setSt("pending","האישור בוטל");};
  if($("#oRestore"))$("#oRestore").onclick=()=>setSt("pending","ההזמנה חזרה לממתינה");
  if($("#oAdv"))$("#oAdv").onclick=()=>{const n=fulNext(o);o.ful=n;(o.fulLog??=[]).push({ful:n,at:new Date().toISOString()});touch();renderOrder();toast(fulLabel(o)[0]);};
  if($("#oFulBack"))$("#oFulBack").onclick=()=>{const order=[o.engrave?"engrave":null,"packing","ready","shipped"].filter(Boolean);const i=order.indexOf(fulOf(o));if(i>0){o.ful=order[i-1];touch();renderOrder();}};
}

// ---------- suppliers ----------
function renderSups(){
  $("#view").innerHTML=`<div class="row" style="justify-content:space-between"><div><h1>ספקים ומפעלים</h1><p class="sub">פרטי קשר והערות לכל מפעל.</p></div><button class="btn" id="supNew">+ ספק</button></div>
  <div class="tablewrap"><table><thead><tr><th>שם</th><th>מדינה</th><th>איש קשר</th><th>טלפון / וואטסאפ</th><th>מייל</th><th>הערות</th><th class="num">מכולות</th><th></th></tr></thead><tbody>
  ${db.suppliers.map((x,i)=>`<tr data-i="${i}">${["name","country","contact","phone","email","notes"].map(k=>`<td><input data-s="${k}" value="${esc(x[k])}" ${["phone","email"].includes(k)?'dir="ltr"':""}></td>`).join("")}
    <td class="num">${db.shipments.filter(s=>x.name&&shipSuppliers(s).includes(x.name)).length||""}</td><td><button class="btn sm ghost" data-rm="${i}">✕</button></td></tr>`).join("")||`<tr><td colspan="8" class="muted">עוד אין ספקים.</td></tr>`}
  </tbody></table></div>`;
  $("#supNew").onclick=()=>{db.suppliers.push({id:uid(),name:""});touch();renderSups();};
  document.querySelectorAll("[data-s]").forEach(el=>el.oninput=()=>{db.suppliers[+el.closest("tr").dataset.i][el.dataset.s]=el.value;touch();});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{if(!confirm("למחוק את הספק?"))return;db.suppliers.splice(+b.dataset.rm,1);touch();renderSups();});
}

// ---------- settings ----------
function renderSettings(){
  $("#view").innerHTML=`<h1>הגדרות</h1><p class="sub">קטגוריות, גיבוי ויציאה.</p>
  <h2>קטגוריות וקודי מק״ט</h2><div class="panel"><p class="muted" style="margin-top:0">הקוד הוא החלק הראשון של המק״ט. אחרי שיש מוצרים בקטגוריה, לא כדאי לשנות את הקוד שלה.</p>
    <table><thead><tr><th style="width:90px">קוד</th><th>קטגוריה</th><th class="num">מוצרים</th></tr></thead><tbody>
    ${db.categories.map((c,i)=>{const n=db.products.filter(p=>p.cat===c.code).length;return `<tr data-i="${i}"><td><input data-c="code" value="${esc(c.code)}" dir="ltr" maxlength="3" ${n?"disabled":""}></td><td><input data-c="name" value="${esc(c.name)}"></td><td class="num">${n||""}</td></tr>`;}).join("")}
    </tbody></table><button class="btn sm ghost" id="catNew" style="margin-top:10px">+ קטגוריה</button></div>
  <h2>עלויות קבועות להזמנות</h2><div class="panel"><p class="muted" style="margin-top:0">נכנסות לעלות של כל הזמנה כשמחשבים רווח גולמי. אפשר להשאיר 0 ולמלא בהמשך.</p><div class="grid">
    ${[["markup","מקדם מחיר מכירה (עלות × ...)"],["costFiller","מילוי וסרט לכל מארז (₪)"],["costLabor","עבודת אריזה לכל מארז (₪)"],["costCard","כרטיס ברכה לכל מארז (₪)"],["costEngrave","חריטה לכל מארז (₪)"],["shipOne","משלוח לכתובת אחת, להזמנה (₪)"],["shipIndiv","משלוח פרטני לכל נמען (₪)"],["shipVip","משלוח VIP לכל נמען (₪)"],["minMargin","התראה מתחת לאחוז רווח (%)"],["vatRate","מע״מ (%)"]].map(([k,l])=>`<label class="f">${l}<input data-st="${k}" inputmode="decimal" dir="ltr" value="${esc(db.settings[k])}"></label>`).join("")}</div></div>
  <h2>גיבוי</h2><div class="panel"><p class="muted" style="margin-top:0">המערכת שומרת אוטומטית 30 גרסאות אחרונות. מומלץ להוריד גם גיבוי למחשב מדי פעם.</p>
    <div class="row"><button class="btn ghost" id="bkOut">הורדת גיבוי</button><button class="btn ghost" id="bkIn">שחזור מגיבוי</button><input type="file" id="bkFile" accept=".json" hidden></div></div>
  <h2>חשבון</h2><div class="panel"><button class="btn danger" id="logout">יציאה</button></div>`;
  document.querySelectorAll("[data-c]").forEach(el=>el.onchange=()=>{const c=db.categories[+el.closest("tr").dataset.i];let v=el.value.trim();
    if(el.dataset.c==="code"){v=v.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!v||db.categories.some(x=>x!==c&&x.code===v)){toast("קוד ריק או כפול");el.value=c.code;return;}}c[el.dataset.c]=v;touch();});
  document.querySelectorAll("[data-st]").forEach(el=>el.onchange=()=>{db.settings[el.dataset.st]=num(el.value);touch();});
  $("#catNew").onclick=()=>{db.categories.push({code:newCatCode(),name:"קטגוריה חדשה"});touch();renderSettings();};
  $("#bkOut").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:"application/json"}));a.download=`noya-office-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();};
  $("#bkIn").onclick=()=>$("#bkFile").click();
  $("#bkFile").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.products)||!Array.isArray(d.shipments))throw new Error("קובץ לא תקין");
    if(!confirm("השחזור יחליף את כל הנתונים הנוכחיים. להמשיך?"))return;db=d;touch();toast("שוחזר");render();}catch(err){toast("השחזור נכשל: "+err.message);}};
  $("#logout").onclick=async()=>{await save();await api("logout",{method:"POST"}).catch(()=>{});location.reload();};
}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modal").hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").hidden=true;});
</script>
</body>
</html>
